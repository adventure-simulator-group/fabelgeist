<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Fabelgeist · Texture Studio</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191e22;color:#e9e9dd;font:16px system-ui}#studio{width:100%;height:100%;display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#191e22;z-index:2}h1{font-size:20px;font-weight:500;letter-spacing:.1em}p{color:#b7c2ab;max-width:40rem;line-height:1.6}</style></head>
<body><canvas id="studio"></canvas><div id="loading"><h1>FABELGEIST / TEXTURE STUDIO</h1><p id="message">Loading the material workshop…</p></div>
<script type="module">
import init, {start_studio} from './pkg/adventuresim_texture_studio.js';
const message = document.querySelector('#message');
try {
  if (!navigator.gpu) throw new Error('This studio requires a browser with WebGPU. Open it in a current Chrome or Edge browser over HTTPS or localhost.');
  window.textureStudioModule = await WebAssembly.compileStreaming(fetch('./pkg/adventuresim_texture_studio_bg.wasm'));
  await init({module_or_path: window.textureStudioModule});
  document.querySelector('#loading').remove(); start_studio();
} catch (error) { message.textContent = String(error); console.error(error); }
</script></body></html>

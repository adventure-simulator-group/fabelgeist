<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Fabelgeist · Heraldry Studio</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a;color:#eee6d5;font:16px system-ui}#studio{width:100%;height:100%;display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#10151a;z-index:2}h1{font-size:20px;font-weight:500;letter-spacing:.1em}p{color:#c6bcaa;max-width:40rem;line-height:1.6}</style></head>
<body><canvas id="studio"></canvas><div id="loading"><h1>FABELGEIST / HERALDRY STUDIO</h1><p id="message">Preparing the heraldic workshop…</p></div>
<script type="module">
import init, {start_studio} from './pkg/adventuresim_heraldry_studio.js';
const loading = document.querySelector('#loading');
const fail = error => {
  loading.style.display = 'grid';
  document.querySelector('#message').textContent = error?.message || String(error);
};
window.addEventListener('unhandledrejection', event => fail(event.reason));
window.addEventListener('error', event => fail(event.error || event.message));
try {
  if (!navigator.gpu) throw new Error('This studio requires WebGPU. Use Chrome or Edge over HTTPS or localhost.');
  if (!await navigator.gpu.requestAdapter()) throw new Error('No usable WebGPU adapter was found. Enable graphics acceleration in a WebGPU-capable browser, or use the native Heraldry Studio.');
  window.heraldryModule = await WebAssembly.compileStreaming(fetch('./pkg/adventuresim_heraldry_studio_bg.wasm'));
  await init({module_or_path: window.heraldryModule});
  loading.style.display = 'none'; start_studio();
} catch (error) { fail(error); }
</script></body></html>

[package]
name = "adventuresim-tactical-client"
description = "Fabelgeist: Wasm game client"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = ["debug"]
debug = ["bevy/debug", "bevy/bevy_remote", "adventuresim-tactical-core/avian_debug"]
tracy = ["bevy/trace_tracy", "dep:tracing-tracy", "dep:tracing-subscriber", "dep:tracy-client-sys"]
# See src/lib.rs - only used by crates/adventuresim-tactical-brp-generator.
remote-types = ["debug"]

[dependencies]
adventuresim-procedural-materials.workspace = true
bevy.workspace = true
bevy_flair.workspace = true
bevy_egui.workspace = true
bevy_mod_outline.workspace = true
adventuresim-core.workspace = true
adventuresim-tactical-core = { workspace = true, features = ["meshgen"] }
adventuresim-tactical-netcode = { workspace = true, features = ["client"] }
adventuresim-weapon-model.workspace = true
adventuresim-world-schema.workspace = true
adventuresim-building-generator = { workspace = true, features = ["sign-render"] }
adventuresim-procedural-textures.workspace = true
fabelgeist-determinism.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
tracing.workspace = true
web-time.workspace = true
todo-or-die = { version = "0.1.2", features = ["crate"] }
tracing-tracy = { version = "0.11", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
tracy-client-sys = { version = "=0.28.0", optional = true }
# Drives every grass renderer on both native and wasm: the fork's WebGPU
# indirect-draw fallback loops draw_indexed_indirect in place of
# multi-draw-indirect, so the browser bundle uses the same instanced path.
bevy_eidolon.workspace = true

[target."cfg(not(target_family = \"wasm\"))".dependencies]
bevy = { workspace = true, default-features = true, features = ["file_watcher", "jpeg"] }

[target."cfg(target_family = \"wasm\")".dependencies]
bevy = { workspace = true, default-features = false, features = [
    "default_app",
    "std",
    "bevy_winit",
    "web",
    "webgpu",
    "2d_bevy_render",
    "3d_bevy_render",
    "bevy_anti_alias",
    "ui_bevy_render",
    "scene",
    "picking",
    "audio",
    "jpeg",
    "png",
    "smaa_luts",
    "tonemapping_luts",
    "zstd_rust",
] }
console_error_panic_hook.workspace = true
wasm-bindgen.workspace = true

[lints]
workspace = true

[lib]
name = "adventuresim_tactical_client"
path = "src/lib.rs"

[[bin]]
name = "adventuresim-tactical-client"
doc = false

[[bin]]
name = "animation-viewer"
path = "src/animation_viewer_main.rs"
doc = false
required-features = ["debug"]

[[bin]]
name = "tactical-scene-viewer"
path = "src/tactical_scene_viewer_main.rs"
doc = false
required-features = ["debug"]

[[bin]]
name = "tactical-sky-viewer"
path = "src/tactical_sky_viewer_main.rs"
doc = false
required-features = ["debug"]

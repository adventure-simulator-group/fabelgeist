[package]
name = "fabelgeist-bvh"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/adventure-simulator-group/fabelgeist"

[dependencies]
fabelgeist-gpu = { "default-features" = false, "path" = "../fabelgeist-gpu" }
fabelgeist-math = { "default-features" = false, "path" = "../fabelgeist-math" }
anyhow = { "version" = "1.0" }
bytemuck = { "version" = "1.16", "features" = ["derive"] }
fabelgeist-compute = { "optional" = true, "path" = "../fabelgeist-compute" }

[dev-dependencies]
tokio = { "version" = "1", "features" = ["full"] }

[features]
default = ["gpu"]
gpu = ["dep:fabelgeist-compute"]

[lints]
workspace = true

<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    // On hybrid-GPU machines (laptops with an integrated + discrete GPU, or a
    // system with a software Vulkan fallback), WebGPU's requestAdapter picks the
    // low-power / integrated / software adapter unless high-performance is
    // explicitly requested. Force the discrete GPU so the client runs on real
    // hardware instead of SwiftShader/iGPU.
    (function () {
        if (navigator.gpu && navigator.gpu.requestAdapter) {
            const orig = navigator.gpu.requestAdapter.bind(navigator.gpu);
            navigator.gpu.requestAdapter = (opts) =>
                orig({ ...(opts || {}), powerPreference: "high-performance" });
        }
    })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabelgeist Tactical</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050608;
            color: #f2f2f2;
            font-family: system-ui, sans-serif;
        }
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #overlay {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: min(420px, calc(100vw - 32px));
            padding: 14px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            backdrop-filter: blur(8px);
        }
        #overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        #overlay-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #overlay.collapsed {
            gap: 0;
            width: auto;
            padding: 8px 10px;
        }
        #overlay.collapsed #overlay-body {
            display: none;
        }
        #toggle {
            flex: 0 0 auto;
            padding: 2px 10px;
            line-height: 1.4;
            font-size: 1rem;
        }
        #controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: inherit;
            font: inherit;
        }
        input {
            flex: 1 1 180px;
            min-width: 0;
        }
        button {
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        #status {
            font-size: 0.95rem;
            color: #b7d3ff;
            white-space: pre-wrap;
        }
        #hint {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div id="overlay">
        <div id="overlay-header">
            <strong>Browser Tactical Client</strong>
            <button id="toggle" type="button" title="Collapse/expand panel" aria-expanded="true">▾</button>
        </div>
        <div id="overlay-body">
            <div id="controls">
                <input id="server" type="text" value="127.0.0.1:6001" spellcheck="false">
                <input id="player-id" type="number" value="2" min="0" step="1">
                <button id="connect" type="button">Connect</button>
            </div>
            <div id="status">Ready.</div>
            <div id="hint">Default is the browser-safe `just win-web` server: `127.0.0.1:6001`, player id `2`. Browsers block port `6000`.</div>
        </div>
    </div>

    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const serverInput = document.getElementById('server');
        const playerIdInput = document.getElementById('player-id');
        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connect');
        const overlayEl = document.getElementById('overlay');
        const toggleBtn = document.getElementById('toggle');

        let started = false;

        function setCollapsed(collapsed) {
            overlayEl.classList.toggle('collapsed', collapsed);
            toggleBtn.textContent = collapsed ? '▸' : '▾';
            toggleBtn.setAttribute('aria-expanded', String(!collapsed));
            try {
                localStorage.setItem('tacticalOverlayCollapsed', collapsed ? '1' : '0');
            } catch (_) { /* storage may be unavailable */ }
        }

        toggleBtn.addEventListener('click', () => {
            setCollapsed(!overlayEl.classList.contains('collapsed'));
        });

        // Restore the last collapsed state (default expanded).
        try {
            if (localStorage.getItem('tacticalOverlayCollapsed') === '1') {
                setCollapsed(true);
            }
        } catch (_) { /* storage may be unavailable */ }

        const defaultServer = '127.0.0.1:6001';
        serverInput.value = defaultServer;

        if (params.get('server')) {
            serverInput.value = params.get('server');
        }
        if (params.get('id')) {
            playerIdInput.value = params.get('id');
        }

        function setStatus(message) {
            statusEl.textContent = message;
        }

        async function startClient() {
            if (started) {
                return;
            }
            started = true;

            const server = serverInput.value.trim() || defaultServer;
            const playerId = playerIdInput.value.trim() || '2';
            setStatus(`Connecting to ${server} as player ${playerId}...`);

            // Collapse the panel out of the way so it stops overlaying the
            // in-game debug overlay once play begins.
            setCollapsed(true);

            const url = new URL(window.location.href);
            url.searchParams.set('server', server);
            url.searchParams.set('id', playerId);
            history.replaceState(null, '', url);

            try {
                if (!navigator.gpu) {
                    throw new Error('WebGPU is not available in this browser or context.');
                }

                const module = await import('./wasm/adventuresim-tactical-client.js');
                await module.default();
                const [graphics, audio] = await Promise.all([
                    fetch('./assets/config/tactical-graphics.yaml'),
                    fetch('./assets/config/tactical-audio.yaml'),
                ]);
                if (!graphics.ok) {
                    throw new Error(`Tactical graphics config: HTTP ${graphics.status}`);
                }
                if (!audio.ok) {
                    throw new Error(`Tactical audio config: HTTP ${audio.status}`);
                }
                await module.wasm_run([
                    'adventuresim-tactical-client',
                    '--server-addr', server,
                    '--id', playerId,
                ], await graphics.text(), await audio.text());
                setStatus(`Running.\nServer: ${server}\nPlayer: ${playerId}`);
            } catch (error) {
                started = false;
                console.error(error);
                setStatus(`Failed to start client.\n${error}`);
                // Re-expand so the failure message is visible.
                setCollapsed(false);
            }
        }

        connectBtn.addEventListener('click', startClient);

        if (params.has('autostart') || params.has('server') || params.has('id')) {
            startClient();
        }
    </script>
</body>
</html>

[package]
name = "fabelgeist-fbx"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/adventure-simulator-group/fabelgeist"
license = "AGPL-3.0"

[dependencies]
anyhow = "1"
derive_more = { version = "2.1.1", default-features = false, features = ["debug", "display", "error", "from"] }
fabelgeist-rig = { path = "../fabelgeist-rig" }
# Pure-Rust inflate (miniz_oxide) for deflated FBX array properties; no C
# toolchain is pulled in.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
num_enum = { version = "0.7.6", default-features = false }

[lints]
workspace = true

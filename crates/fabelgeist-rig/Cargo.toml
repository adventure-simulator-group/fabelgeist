[package]
name = "fabelgeist-rig"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/adventure-simulator-group/fabelgeist"
license = "GPL-3.0"

[dependencies]
derive_more = { version = "2.1.1", features = ["display", "from", "into"] }
strum = { version = "0.27.2", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

[package]
name = "adventuresim-environment"
description = "Living environments: plant ecosystems grown by fabelgeist-botany, and a viewer to watch them grow"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
viewer = [
  "fabelgeist-botany/viewer",
  "dep:fabelgeist-gpu",
  "dep:eframe",
  "dep:wgpu",
  "dep:image",
  "dep:pollster",
  "dep:clap",
]

[dependencies]
anyhow = "1"
thiserror.workspace = true
fabelgeist-botany = { path = "../fabelgeist-botany" }
fabelgeist-gpu = { path = "../fabelgeist-gpu", default-features = false, optional = true }
eframe = { version = "0.34.3", default-features = false, features = [
  "default_fonts",
  "wgpu",
  "x11",
  "wayland",
], optional = true }
# The botany renderer's wgpu; the viewer hands it eframe's device.
wgpu = { version = "29.0", default-features = false, optional = true }
image = { workspace = true, features = ["png"], optional = true }
pollster = { version = "0.4", optional = true }
clap = { workspace = true, optional = true }

[lints]
workspace = true

[[bin]]
name = "environment-viewer"
path = "src/viewer/main.rs"
required-features = ["viewer"]

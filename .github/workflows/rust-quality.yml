name: Rust quality

on:
  push:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "content/tactical/combat.yaml"
      - "crates/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "rust-quality.toml"
      - "rust-quality-baseline.toml"
      - "justfile"
      - "scripts/dev_stack.py"
      - "scripts/check_calendar_api.py"
      - "scripts/test_check_calendar_api.py"
      - "scripts/tests/test_dev_stack.py"
      - "scripts/tests/test_building_review_boundary.py"
      - "scripts/capture*review.py"
      - "scripts/capture_shop_signs.py"
      - "scripts/capture_workplaces.py"
      - "assets/tactical-scenes/*review*.json"
      - ".github/workflows/rust-quality.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "content/tactical/combat.yaml"
      - "crates/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "rust-quality.toml"
      - "rust-quality-baseline.toml"
      - "justfile"
      - "scripts/dev_stack.py"
      - "scripts/check_calendar_api.py"
      - "scripts/test_check_calendar_api.py"
      - "scripts/tests/test_dev_stack.py"
      - "scripts/tests/test_building_review_boundary.py"
      - "scripts/capture*review.py"
      - "scripts/capture_shop_signs.py"
      - "scripts/capture_workplaces.py"
      - "assets/tactical-scenes/*review*.json"
      - ".github/workflows/rust-quality.yml"
  workflow_dispatch:
    inputs:
      regenerate_fixtures:
        description: Regenerate procedural fixtures with the existing exporters
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SPACETIMEDB_VERSION: "2.6.1"

jobs:
  rust-quality:
    if: ${{ !inputs.regenerate_fixtures }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-quality
          cache-on-failure: true
      - name: Install pinned SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version install "$SPACETIMEDB_VERSION"
          "$HOME/.local/bin/spacetime" version use "$SPACETIMEDB_VERSION"
      - name: Install configured Linux linker
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          mold libasound2-dev libudev-dev libwayland-dev libx11-dev
          libxcursor-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers
      - name: Check formatting
        run: |
          format_status=0
          cargo fmt --all -- --check || format_status=1
          cargo fmt --manifest-path crates/adventuresim-character-creator/Cargo.toml -- --check || format_status=1
          cargo fmt --manifest-path crates/fabelgeist-mhr/Cargo.toml -- --check || format_status=1
          cargo fmt --manifest-path crates/fabelgeist-numpy-storage/Cargo.toml -- --check || format_status=1
          exit "$format_status"
      - name: Test generated bindings verifier
        run: >-
          python3 -m unittest
          scripts.tests.test_dev_stack.WorkflowTests.test_binding_diff_detects_changed_and_extra_files
      - name: Check building review presentation boundary
        run: python3 -m unittest scripts.tests.test_building_review_boundary
      - name: Verify generated SpacetimeDB bindings
        run: python3 scripts/dev_stack.py verify-bindings
      - name: Test shared schema and GPU readback boundaries
        run: |
          cargo test --package adventuresim-world-schema --all-features
          cargo test --package fabelgeist-gpu --lib data::gpu::buffer::readback::tests
      - name: Test existing GPU contracts
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/texture-view-runtime
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR" target/texture-view-validation
          chmod 700 "$XDG_RUNTIME_DIR"
          git rev-parse HEAD > target/texture-view-validation/source.txt
          printf '%s\n' "$EXPECTED_SOURCE" > target/texture-view-validation/pr-head.txt
          printf '%s\n' 'cargo test --locked --package fabelgeist-gpu --lib -- --test-threads=1 --nocapture' > target/texture-view-validation/library.command.txt
          cargo test --locked --package fabelgeist-gpu --lib -- --test-threads=1 --nocapture 2>&1 | tee target/texture-view-validation/library.log
          printf '%s\n' 'cargo test --locked --package fabelgeist-gpu --doc' > target/texture-view-validation/doctests.command.txt
          cargo test --locked --package fabelgeist-gpu --doc 2>&1 | tee target/texture-view-validation/doctests.log
          printf '%s\n' 'cargo test --locked --package fabelgeist-gpu --lib globals::wgpu_context::tests::a_borrowed_device_skips_blocking_validation -- --exact --test-threads=1 --nocapture' > target/texture-view-validation/borrowed.command.txt
          cargo test --locked --package fabelgeist-gpu --lib globals::wgpu_context::tests::a_borrowed_device_skips_blocking_validation -- --exact --test-threads=1 --nocapture 2>&1 | tee target/texture-view-validation/borrowed.log
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("target/texture-view-validation")
          source = (root / "source.txt").read_text().strip()
          if source != (root / "pr-head.txt").read_text().strip():
              raise SystemExit("Texture-view evidence has the wrong source revision")
          results = {}
          for label, expected in [("library", 13), ("doctests", 2), ("borrowed", 1)]:
              log = (root / f"{label}.log").read_text()
              summaries = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;", log)
              if len(summaries) != 1:
                  raise SystemExit(f"Expected one nonempty passing {label} result")
              passed, failed, ignored = map(int, summaries[0])
              if not passed or failed or ignored or (expected is not None and passed != expected):
                  raise SystemExit(f"Unexpected {label} execution population: {summaries[0]}")
              results[label] = {"passed": passed, "failed": failed, "ignored": ignored}
          report = {"source": source, "results": results}
          (root / "results.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Test resolved Bevy guard
        run: cargo test --locked --package fabelgeist-rust-quality --test bevy_version_guard
      - name: Test checked FBX array encoding
        run: >-
          cargo test --locked --package fabelgeist-fbx --lib
          array_encoding_tests::array_encoding_preserves_actual_main_payload_and_error_behavior
          -- --exact --nocapture
      - name: Test existing ZIP member-count target
        id: zip_member_counts
        timeout-minutes: 30
        env:
          ZIP_MEMBER_EVIDENCE: ${{ runner.temp }}/zip-member-count-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY_ZIP_MEMBER_COUNTS'
          import hashlib
          import json
          import os
          import pathlib
          import selectors
          import shlex
          import signal
          import subprocess
          import time
          
          evidence = pathlib.Path(os.environ["ZIP_MEMBER_EVIDENCE"])
          evidence.mkdir()
          repository = pathlib.Path.cwd().resolve()
          deadline = time.monotonic() + 30 * 60 - 10
          text_limit = 32 * 1024 * 1024
          failure_reserve = 64 * 1024
          processes = []
          
          
          def text_bytes():
              return sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          
          
          def remaining():
              if time.monotonic() >= deadline:
                  raise RuntimeError("ZIP member-count step reached its 30-minute deadline")
              return text_limit - failure_reserve - text_bytes()
          
          
          def write(name, value):
              data = value.encode() if isinstance(value, str) else value
              if len(data) > remaining():
                  raise RuntimeError("ZIP member-count evidence reached its 32 MiB text cap")
              with (evidence / name).open("xb") as destination:
                  destination.write(data)
          
          
          def group_exists(pid):
              try:
                  os.killpg(pid, 0)
                  return True
              except ProcessLookupError:
                  return False
          
          
          def close_group(process):
              if group_exists(process.pid):
                  os.killpg(process.pid, signal.SIGTERM)
                  stop = time.monotonic() + 4
                  while group_exists(process.pid) and time.monotonic() < stop:
                      process.poll()
                      time.sleep(0.05)
                  if group_exists(process.pid):
                      os.killpg(process.pid, signal.SIGKILL)
              process.wait(timeout=1)
              if group_exists(process.pid):
                  raise RuntimeError("Owned ZIP validation process group remains present")
          
          
          def run(argv, stdout_name, stderr_name=None):
              remaining()
              started = time.monotonic()
              process = subprocess.Popen(
                  argv, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE if stderr_name else subprocess.STDOUT,
                  start_new_session=True,
              )
              record = {"argv": argv, "pid": process.pid, "process_group": process.pid,
                        "stdout": stdout_name, "stderr": stderr_name, "closed": False}
              processes.append(record)
              selector = selectors.DefaultSelector()
              outputs = []
              try:
                  for stream, name in [(process.stdout, stdout_name),
                                       (process.stderr, stderr_name)]:
                      if stream is None:
                          continue
                      output = (evidence / name).open("xb")
                      outputs.append(output)
                      selector.register(stream, selectors.EVENT_READ, output)
                  while selector.get_map():
                      remaining()
                      for key, _ in selector.select(timeout=1):
                          chunk = os.read(key.fileobj.fileno(), 64 * 1024)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          available = remaining()
                          if len(chunk) > available:
                              key.data.write(chunk[:max(available, 0)])
                              key.data.flush()
                              raise RuntimeError("ZIP member-count evidence reached its 32 MiB text cap")
                          key.data.write(chunk)
                          key.data.flush()
                  returncode = process.wait(timeout=1)
                  record["returncode"] = returncode
                  if returncode:
                      raise RuntimeError("ZIP validation command failed: " + str(argv))
              finally:
                  for output in outputs:
                      output.close()
                  selector.close()
                  close_group(process)
                  record["closed"] = True
                  record["elapsed_seconds"] = time.monotonic() - started
              write("process-" + str(len(processes)) + ".json",
                    json.dumps(record, indent=2) + "\n")
          
          
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      remaining()
                      value.update(chunk)
              return value.hexdigest()
          
          
          try:
              run(["git", "rev-parse", "HEAD"], "head.txt")
              run(["rustc", "-Vv"], "toolchain.txt")
              host_lines = [line.removeprefix("host: ")
                            for line in (evidence / "toolchain.txt").read_text().splitlines()
                            if line.startswith("host: ")]
              if len(host_lines) != 1:
                  raise RuntimeError("Expected one pinned Rust host triple")
              manifest = repository / "crates/fabelgeist-numpy-storage/Cargo.toml"
              common = ["cargo", "test", "--locked", "--manifest-path",
                        str(manifest.relative_to(repository)), "--all-features",
                        "--test", "member_counts"]
              graph_argv = ["cargo", "metadata", "--locked", "--manifest-path",
                            str(manifest.relative_to(repository)), "--all-features",
                            "--filter-platform", host_lines[0], "--format-version", "1"]
              build_argv = common + ["--no-run", "--message-format=json"]
              runtime_argv = common + ["-vv"]
              write("commands.json", json.dumps({"graph_argv": graph_argv,
                    "build_argv": build_argv, "planned_runtime_argv": runtime_argv}, indent=2) + "\n")
              run(graph_argv, "graph.json", "graph-stderr.log")
              run(build_argv, "artifacts.jsonl", "compiler.log")
              graph = json.loads((evidence / "graph.json").read_text())
              packages = {package["id"]: package for package in graph["packages"]}
              selected_packages = [package for package in packages.values()
                                   if pathlib.Path(package["manifest_path"]).resolve() == manifest]
              if len(selected_packages) != 1:
                  raise RuntimeError("Expected one selected NumPy storage package")
              package = selected_packages[0]
              if pathlib.Path(package["manifest_path"]).parent.parent.parent != repository:
                  raise RuntimeError("Selected package does not identify the checked-out repository")
              targets = [target for target in package["targets"]
                         if target["name"] == "member_counts" and target["kind"] == ["test"]
                         and target.get("test")]
              if len(targets) != 1:
                  raise RuntimeError("Expected exactly the existing member_counts integration target")
              records = {}
              depfiles = set()
              executables = set()
              compiled = []
          
              def bind(path):
                  path = path.resolve(strict=True)
                  if path not in records:
                      if not path.is_file():
                          raise RuntimeError("Bound input is not a regular file: " + str(path))
                      records[path] = {"path": str(path), "bytes": path.stat().st_size,
                                       "sha256": digest(path)}
          
              for name in ["head.txt", "toolchain.txt", "graph.json", "graph-stderr.log",
                           "artifacts.jsonl", "compiler.log", "commands.json"]:
                  bind(evidence / name)
              for path in [repository / "Cargo.toml", repository / "Cargo.lock", manifest,
                           manifest.parent / "Cargo.lock", repository / "rust-toolchain.toml",
                           repository / ".github/workflows/rust-quality.yml"]:
                  bind(path)
              for path in (repository / ".cargo").glob("config*"):
                  bind(path)
              tracked = subprocess.check_output(
                  ["git", "ls-files", "-z", "crates/fabelgeist-numpy-storage"], cwd=repository)
              for filename in tracked.split(b"\0"):
                  if filename:
                      bind(repository / os.fsdecode(filename))
              for line in (evidence / "artifacts.jsonl").read_text().splitlines():
                  message = json.loads(line)
                  if message.get("reason") != "compiler-artifact":
                      continue
                  if message["package_id"] not in packages:
                      raise RuntimeError("Compiled package absent from captured graph")
                  bind(pathlib.Path(message["manifest_path"]))
                  bind(pathlib.Path(message["target"]["src_path"]))
                  compiled.append({"package_id": message["package_id"], "target": message["target"],
                                   "features": message["features"], "profile": message["profile"],
                                   "filenames": message["filenames"], "executable": message.get("executable")})
                  for filename in message["filenames"]:
                      bind(pathlib.Path(filename))
                  if "custom-build" in message["target"]["kind"]:
                      continue
                  if message["package_id"] == package["id"] and message["profile"]["test"]:
                      if (message["target"]["name"] != "member_counts"
                              or message["target"]["kind"] != ["test"] or not message.get("executable")):
                          raise RuntimeError("Unexpected selected NumPy test executable")
                      executable = pathlib.Path(message["executable"]).resolve(strict=True)
                      bind(executable)
                      executables.add(executable)
                  selected = set()
                  for filename in message["filenames"]:
                      path = pathlib.Path(filename)
                      stem = path.stem if path.suffix in {".rlib", ".rmeta", ".so"} else path.name
                      if path.suffix in {".rlib", ".rmeta", ".so"} and stem.startswith("lib"):
                          stem = stem[3:]
                      candidate = path.with_name(stem + ".d")
                      if candidate.is_file():
                          selected.add(candidate)
                  if not selected:
                      raise RuntimeError("No selected depfile for " + message["target"]["name"])
                  for depfile in selected:
                      if depfile in depfiles:
                          continue
                      depfiles.add(depfile)
                      bind(depfile)
                      prerequisites = depfile.read_text().replace("\\\n", " ").split(": ", 1)[1].splitlines()[0]
                      for filename in shlex.split(prerequisites):
                          path = pathlib.Path(filename)
                          if not path.is_absolute():
                              path = repository / path
                              if not path.is_file():
                                  path = pathlib.Path(message["manifest_path"]).parent / filename
                          bind(path)
              if len(executables) != 1 or not depfiles:
                  raise RuntimeError("Expected one bound member_counts executable and compiler depfiles")
              if subprocess.check_output(["git", "rev-parse", "HEAD"]).decode() != (evidence / "head.txt").read_text():
                  raise RuntimeError("HEAD changed before ZIP member-count runtime")
              binding = {"bound_before_runtime": True, "selected_package": package["id"],
                         "selected_target": targets[0], "selected_native_executable": str(next(iter(executables))),
                         "compiled_artifacts": compiled, "inputs_and_artifacts": list(records.values()),
                         "selected_depfiles": [str(path) for path in sorted(depfiles)],
                         "custom_build_depfiles_required": False, "prior_processes": processes}
              write("binding-before-runtime.json", json.dumps(binding, indent=2) + "\n")
              print("ZIP member-count binding closed before runtime")
              run(runtime_argv, "full.log")
              for path, record in records.items():
                  if path.stat().st_size != record["bytes"] or digest(path) != record["sha256"]:
                      raise RuntimeError("Bound input or artifact changed during runtime: " + str(path))
              runtime_text = (evidence / "full.log").read_text()
              executable = str(next(iter(executables)))
              if executable not in runtime_text:
                  raise RuntimeError("Runtime log does not identify the bound member_counts executable")
              write("runtime-closure.json", json.dumps({"runtime_argv": runtime_argv,
                    "selected_native_executable": executable, "all_bound_records_unchanged": True,
                    "processes": processes, "text_bytes_before_receipt": text_bytes(),
                    "text_limit_bytes": text_limit, "upload_limit_bytes": 48 * 1024 * 1024,
                    "no_Vulkan_setup_or_runtime_claim": True}, indent=2) + "\n")
              print(runtime_text[-6000:])
          except Exception as failure:
              receipt = {"status": "FAILED_FIRST_CONTRACT", "error": str(failure)[:4096],
                         "processes": processes, "text_bytes": text_bytes(),
                         "runtime_bound": (evidence / "binding-before-runtime.json").exists()}
              data = (json.dumps(receipt, indent=2) + "\n").encode()
              if len(data) > failure_reserve or text_bytes() + len(data) > text_limit:
                  raise RuntimeError("Failure receipt exceeds its reserved evidence capacity") from failure
              with (evidence / "first-failure.json").open("xb") as destination:
                  destination.write(data)
              raise
          finally:
              if text_bytes() > 48 * 1024 * 1024:
                  raise RuntimeError("ZIP evidence exceeds its 48 MiB upload cap")
          PY_ZIP_MEMBER_COUNTS
      - name: Preserve ZIP member-count hosted evidence
        if: always() && steps.zip_member_counts.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: zip-member-count-evidence
          path: ${{ runner.temp }}/zip-member-count-evidence
          if-no-files-found: error
      - name: Test existing ZIP extent target
        id: zip_extents
        timeout-minutes: 30
        env:
          ZIP_EXTENT_EVIDENCE: ${{ runner.temp }}/zip-extents-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY_ZIP_EXTENTS'
          import hashlib
          import json
          import os
          import pathlib
          import selectors
          import shlex
          import signal
          import subprocess
          import time
          
          evidence = pathlib.Path(os.environ["ZIP_EXTENT_EVIDENCE"])
          evidence.mkdir()
          repository = pathlib.Path.cwd().resolve()
          deadline = time.monotonic() + 30 * 60 - 10
          text_limit = 32 * 1024 * 1024
          failure_reserve = 64 * 1024
          processes = []
          
          
          def text_bytes():
              return sum(path.stat().st_size for path in evidence.iterdir() if path.is_file())
          
          
          def remaining():
              if time.monotonic() >= deadline:
                  raise RuntimeError("ZIP extent step reached its 30-minute deadline")
              return text_limit - failure_reserve - text_bytes()
          
          
          def write(name, value):
              data = value.encode() if isinstance(value, str) else value
              if len(data) > remaining():
                  raise RuntimeError("ZIP extent evidence reached its 32 MiB text cap")
              with (evidence / name).open("xb") as destination:
                  destination.write(data)
          
          
          def group_exists(pid):
              try:
                  os.killpg(pid, 0)
                  return True
              except ProcessLookupError:
                  return False
          
          
          def close_group(process):
              if group_exists(process.pid):
                  os.killpg(process.pid, signal.SIGTERM)
                  stop = time.monotonic() + 4
                  while group_exists(process.pid) and time.monotonic() < stop:
                      process.poll()
                      time.sleep(0.05)
                  if group_exists(process.pid):
                      os.killpg(process.pid, signal.SIGKILL)
              process.wait(timeout=1)
              if group_exists(process.pid):
                  raise RuntimeError("Owned ZIP validation process group remains present")
          
          
          def run(argv, stdout_name, stderr_name=None):
              remaining()
              started = time.monotonic()
              process = subprocess.Popen(
                  argv, stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE if stderr_name else subprocess.STDOUT,
                  start_new_session=True,
              )
              record = {"argv": argv, "pid": process.pid, "process_group": process.pid,
                        "stdout": stdout_name, "stderr": stderr_name, "closed": False}
              processes.append(record)
              selector = selectors.DefaultSelector()
              outputs = []
              try:
                  for stream, name in [(process.stdout, stdout_name),
                                       (process.stderr, stderr_name)]:
                      if stream is None:
                          continue
                      output = (evidence / name).open("xb")
                      outputs.append(output)
                      selector.register(stream, selectors.EVENT_READ, output)
                  while selector.get_map():
                      remaining()
                      for key, _ in selector.select(timeout=1):
                          chunk = os.read(key.fileobj.fileno(), 64 * 1024)
                          if not chunk:
                              selector.unregister(key.fileobj)
                              key.fileobj.close()
                              continue
                          available = remaining()
                          if len(chunk) > available:
                              key.data.write(chunk[:max(available, 0)])
                              key.data.flush()
                              raise RuntimeError("ZIP extent evidence reached its 32 MiB text cap")
                          key.data.write(chunk)
                          key.data.flush()
                  returncode = process.wait(timeout=1)
                  record["returncode"] = returncode
                  if returncode:
                      raise RuntimeError("ZIP validation command failed: " + str(argv))
              finally:
                  for output in outputs:
                      output.close()
                  selector.close()
                  close_group(process)
                  record["closed"] = True
                  record["elapsed_seconds"] = time.monotonic() - started
              write("process-" + str(len(processes)) + ".json",
                    json.dumps(record, indent=2) + "\n")
          
          
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  while chunk := source.read(1024 * 1024):
                      remaining()
                      value.update(chunk)
              return value.hexdigest()
          
          
          try:
              run(["git", "rev-parse", "HEAD"], "head.txt")
              run(["rustc", "-Vv"], "toolchain.txt")
              host_lines = [line.removeprefix("host: ")
                            for line in (evidence / "toolchain.txt").read_text().splitlines()
                            if line.startswith("host: ")]
              if len(host_lines) != 1:
                  raise RuntimeError("Expected one pinned Rust host triple")
              manifest = repository / "crates/fabelgeist-numpy-storage/Cargo.toml"
              common = ["cargo", "test", "--locked", "--manifest-path",
                        str(manifest.relative_to(repository)), "--all-features",
                        "--test", "zip_extents"]
              graph_argv = ["cargo", "metadata", "--locked", "--manifest-path",
                            str(manifest.relative_to(repository)), "--all-features",
                            "--filter-platform", host_lines[0], "--format-version", "1"]
              build_argv = common + ["--no-run", "--message-format=json"]
              runtime_argv = common + ["-vv"]
              write("commands.json", json.dumps({"graph_argv": graph_argv,
                    "build_argv": build_argv, "planned_runtime_argv": runtime_argv}, indent=2) + "\n")
              run(graph_argv, "graph.json", "graph-stderr.log")
              run(build_argv, "artifacts.jsonl", "compiler.log")
              graph = json.loads((evidence / "graph.json").read_text())
              packages = {package["id"]: package for package in graph["packages"]}
              selected_packages = [package for package in packages.values()

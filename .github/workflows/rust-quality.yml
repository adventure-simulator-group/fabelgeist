name: Rust quality

on:
  push:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "rust-quality.toml"
      - "rust-quality-baseline.toml"
      - "justfile"
      - "scripts/dev_stack.py"
      - "scripts/check_calendar_api.py"
      - "scripts/test_check_calendar_api.py"
      - "scripts/tests/test_dev_stack.py"
      - "scripts/tests/test_building_review_boundary.py"
      - "scripts/capture*review.py"
      - "scripts/capture_shop_signs.py"
      - "scripts/capture_workplaces.py"
      - "assets/tactical-scenes/*review*.json"
      - ".github/workflows/rust-quality.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "rustfmt.toml"
      - "rust-toolchain.toml"
      - "rust-quality.toml"
      - "rust-quality-baseline.toml"
      - "justfile"
      - "scripts/dev_stack.py"
      - "scripts/check_calendar_api.py"
      - "scripts/test_check_calendar_api.py"
      - "scripts/tests/test_dev_stack.py"
      - "scripts/tests/test_building_review_boundary.py"
      - "scripts/capture*review.py"
      - "scripts/capture_shop_signs.py"
      - "scripts/capture_workplaces.py"
      - "assets/tactical-scenes/*review*.json"
      - ".github/workflows/rust-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SPACETIMEDB_VERSION: "2.6.1"

jobs:
  rust-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install pinned SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- -y
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/spacetime" version install "$SPACETIMEDB_VERSION"
          "$HOME/.local/bin/spacetime" version use "$SPACETIMEDB_VERSION"
      - name: Install configured Linux linker
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          mold libasound2-dev libudev-dev libwayland-dev libx11-dev
          libxcursor-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev
          libxrandr-dev libxi-dev
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/adventuresim-character-creator/Cargo.toml -- --check
          cargo fmt --manifest-path crates/fabelgeist-mhr/Cargo.toml -- --check
          cargo fmt --manifest-path crates/fabelgeist-numpy-storage/Cargo.toml -- --check
      - name: Test generated bindings verifier
        run: >-
          python3 -m unittest
          scripts.tests.test_dev_stack.WorkflowTests.test_binding_diff_detects_changed_and_extra_files
      - name: Check building review presentation boundary
        run: python3 -m unittest scripts.tests.test_building_review_boundary
      - name: Verify generated SpacetimeDB bindings
        run: python3 scripts/dev_stack.py verify-bindings
      - name: Test shared schema and GPU readback boundaries
        run: |
          cargo test --package adventuresim-world-schema --all-features
          cargo test --package fabelgeist-gpu --lib data::gpu::buffer::readback::tests
      - name: Test resolved Bevy guard
        run: cargo test --locked --package fabelgeist-rust-quality --test bevy_version_guard
      - name: Test existing MHR package
        id: mhr_cpu
        timeout-minutes: 60
        run: |
          set -euo pipefail
          export MHR_WEIGHT_EVIDENCE="$RUNNER_TEMP/mhr-solver-weight-evidence"
          mkdir "$MHR_WEIGHT_EVIDENCE"
          sudo apt-get install --no-install-recommends -y libvulkan1 mesa-vulkan-drivers
          export VK_DRIVER_FILES="$(dpkg -L mesa-vulkan-drivers | grep '/lvp_icd.*\.json$')"
          test -f "$VK_DRIVER_FILES"
          dpkg-query -W libvulkan1 mesa-vulkan-drivers > "$MHR_WEIGHT_EVIDENCE/vulkan-runtime.txt"
          printf 'VK_DRIVER_FILES=%s\n' "$VK_DRIVER_FILES" >> "$MHR_WEIGHT_EVIDENCE/vulkan-runtime.txt"
          git rev-parse HEAD > "$MHR_WEIGHT_EVIDENCE/head.txt"
          rustc -Vv > "$MHR_WEIGHT_EVIDENCE/toolchain.txt"
          host=$(sed -n 's/^host: //p' "$MHR_WEIGHT_EVIDENCE/toolchain.txt")
          cargo metadata --locked --manifest-path crates/fabelgeist-mhr/Cargo.toml --all-features --filter-platform "$host" --format-version 1 > "$MHR_WEIGHT_EVIDENCE/graph.json"
          cargo test --locked --manifest-path crates/fabelgeist-mhr/Cargo.toml --all-features --no-run --message-format=json > "$MHR_WEIGHT_EVIDENCE/artifacts.jsonl" 2> "$MHR_WEIGHT_EVIDENCE/compiler.log"
          python3 - <<'PY_BIND'
          import hashlib, json, os, pathlib, shlex, subprocess
          evidence = pathlib.Path(os.environ["MHR_WEIGHT_EVIDENCE"])
          workspace = pathlib.Path.cwd()
          records = {}
          depfiles = set()
          def bind(path):
              path = path.resolve(strict=True)
              if path not in records:
                  digest = hashlib.sha256()
                  with path.open("rb") as source:
                      while chunk := source.read(1024 * 1024):
                          digest.update(chunk)
                  records[path] = {"path": str(path), "bytes": path.stat().st_size, "sha256": digest.hexdigest()}
          for name in ["head.txt", "toolchain.txt", "graph.json", "artifacts.jsonl", "compiler.log", "vulkan-runtime.txt"]:
              bind(evidence / name)
          bind(workspace / "crates/fabelgeist-mhr/Cargo.lock")
          bind(pathlib.Path(os.environ["VK_DRIVER_FILES"]))
          bind(pathlib.Path("/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so"))
          bind(pathlib.Path("/usr/lib/x86_64-linux-gnu/libvulkan.so.1"))
          for line in (evidence / "artifacts.jsonl").read_text().splitlines():
              message = json.loads(line)
              if message.get("reason") != "compiler-artifact":
                  continue
              if "custom-build" in message["target"]["kind"]:
                  continue
              selected = set()
              for filename in message["filenames"]:
                  path = pathlib.Path(filename)
                  bind(path)
                  stem = path.stem if path.suffix in {".rlib", ".rmeta", ".so"} else path.name
                  if path.suffix in {".rlib", ".rmeta", ".so"} and stem.startswith("lib"):
                      stem = stem[3:]
                  candidate = path.with_name(stem + ".d")
                  if candidate.is_file():
                      selected.add(candidate)
              if not selected:
                  raise RuntimeError("No selected depfile for " + message["target"]["name"])
              for depfile in selected:
                  if depfile in depfiles:
                      continue
                  depfiles.add(depfile)
                  bind(depfile)
                  prerequisites = depfile.read_text().replace("\\\n", " ").split(": ", 1)[1].splitlines()[0]
                  for filename in shlex.split(prerequisites):
                      path = pathlib.Path(filename)
                      if not path.is_absolute():
                          path = workspace / path
                          if not path.is_file():
                              path = pathlib.Path(message["manifest_path"]).parent / filename
                      bind(path)
          if not depfiles:
              raise RuntimeError("No test/compiler depfiles selected")
          if subprocess.check_output(["git", "rev-parse", "HEAD"]).decode() != (evidence / "head.txt").read_text():
              raise RuntimeError("HEAD changed before baseline runtime")
          binding = {"inputs_and_artifacts": list(records.values()), "selected_depfiles": [str(p) for p in sorted(depfiles)], "bound_before_runtime": True}
          (evidence / "binding-before-runtime.json").write_text(json.dumps(binding, indent=2) + "\n")
          print("MHR binding closed before runtime: " + str(len(records)) + " records")
          PY_BIND
          cargo test --locked --manifest-path crates/fabelgeist-mhr/Cargo.toml --all-features -vv 2>&1 | tee "$MHR_WEIGHT_EVIDENCE/full.log"
      - name: Preserve MHR hosted validation evidence
        if: always() && steps.mhr_cpu.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: mhr-solver-weight-evidence
          path: ${{ runner.temp }}/mhr-solver-weight-evidence
          if-no-files-found: error
      - name: Measure current Rust length baseline
        id: rust_length_baseline
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export RUST_LENGTH_EVIDENCE="$RUNNER_TEMP/rust-length-baseline-evidence"
          mkdir "$RUST_LENGTH_EVIDENCE"
          git rev-parse HEAD > "$RUST_LENGTH_EVIDENCE/head.txt"
          cp rust-quality-baseline.toml "$RUST_LENGTH_EVIDENCE/checked-in-baseline.toml"
          cargo run --locked --package fabelgeist-rust-quality -- baseline . > "$RUST_LENGTH_EVIDENCE/measured-baseline.toml" 2> "$RUST_LENGTH_EVIDENCE/command.log"
      - name: Preserve Rust length baseline evidence
        if: always() && steps.rust_length_baseline.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: rust-length-baseline-evidence
          path: ${{ runner.temp }}/rust-length-baseline-evidence
          if-no-files-found: error
      - name: Check semantic values and Rust growth
        run: |
          cargo test --package fabelgeist-rust-quality
          cargo run --package fabelgeist-rust-quality -- check .
      - name: Check calendar API ownership
        run: |
          python3 -m unittest scripts.test_check_calendar_api
          python3 scripts/check_calendar_api.py
      - name: Lint tactical client WASM target
        run: cargo clippy --package adventuresim-tactical-client --bin adventuresim-tactical-client --target wasm32-unknown-unknown -- -D warnings
      - name: Test native and WASM deterministic draws
        run: |
          python3 -B -m unittest scripts.test_check_deterministic_rng
          python3 scripts/check_deterministic_rng.py
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          python3 scripts/test_determinism.py
      - name: Run Clippy with warnings denied
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path crates/adventuresim-character-creator/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path crates/fabelgeist-mhr/Cargo.toml --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path crates/fabelgeist-numpy-storage/Cargo.toml --all-targets --all-features -- -D warnings

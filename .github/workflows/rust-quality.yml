                  compiled.append({"package_id": message["package_id"], "target": message["target"],
                                   "features": message["features"], "profile": message["profile"],
                                   "filenames": message["filenames"], "executable": message.get("executable")})
                  for filename in message["filenames"]:
                      bind(pathlib.Path(filename))
                  if "custom-build" in message["target"]["kind"]:
                      continue

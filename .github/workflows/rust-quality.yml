name: Rust quality

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-13
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-quality
          cache-on-failure: true
      - name: Install configured linker
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y mold
      - name: Export existing source-size baseline
        run: |
          mkdir -p target/ci-baseline
          git rev-parse HEAD > target/ci-baseline/revision.txt
          cargo run --locked --package fabelgeist-rust-quality -- baseline . > target/ci-baseline/baseline.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-baseline-${{ github.sha }}
          path: target/ci-baseline/
          if-no-files-found: error

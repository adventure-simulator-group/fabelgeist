[[semantic_families]]
name = "calendar-year"
literals = ["365", "365.0"]
identifier_pattern = '(?i)(days?_per_year|year_days|duration_days|simulation_days|matched_days)'
owners = ["crates/adventuresim-world-schema/src/calendar.rs"]

[[semantic_families]]
name = "basis-points"
literals = ["10000", "10000.0"]
identifier_pattern = '(?i)(basis_points|_bps|bps_|bp:|bp\)|per_whole)'
owners = [
  "crates/adventuresim-world-schema/src/lib.rs",
  "crates/adventuresim-world-schema/src/basis_points.rs",
  "crates/adventuresim-core/src/investigation.rs",
]

[[semantic_families]]
name = "e7-coordinates"
literals = ["10000000", "10000000.0"]
identifier_pattern = '(?i)(e7|longitude|latitude|coordinate)'
owners = ["crates/adventuresim-world-schema/src/coordinates.rs"]

[[semantic_families]]
name = "microdegree-coordinates"
literals = ["1000000", "1000000.0"]
identifier_pattern = '(?i)(microdegree|longitude|latitude|coordinate)'
owners = ["crates/adventuresim-world-schema/src/coordinates.rs"]

[[semantic_families]]
name = "microliters"
literals = ["1000000", "1000000.0"]
identifier_pattern = '(?i)(microliter|liter|volume)'
owners = ["crates/adventuresim-core/src/material.rs"]

[[semantic_families]]
name = "investigation-target-kind"
literals = ["site", "area", "contact", "cohort", "route", "tracks"]
identifier_pattern = '(?i)(target_kind|investigation_target)'
owners = ["crates/adventuresim-core/src/investigation_action.rs"]

[[semantic_families]]
name = "surgery-procedure"
literals = ["bandage", "stitch", "splint", "remove-splint", "extract", "open-body"]
identifier_pattern = '(?i)(procedure|surgery)'
owners = ["crates/adventuresim-core/src/surgery.rs"]

[[semantic_families]]
name = "organization-membership-status"
literals = ["active", "suspended"]
identifier_pattern = '(?i)(membership_status|organization.*status)'
owners = ["crates/adventuresim-core/src/organization.rs"]

[[semantic_families]]
name = "destination-knowledge-stage"
literals = [
  "unknown",
  "textual",
  "landmark",
  "approximate_area",
  "route_segment",
  "exact_believed",
  "visited",
]
identifier_pattern = '(?i)(knowledge_stage|destination.*stage)'
owners = ["crates/adventuresim-core/src/investigation.rs"]

[[semantic_families]]
name = "incapacitation-status"
literals = ["ready", "staggered", "incapacitated"]
identifier_pattern = '(?i)(incapacitation_status|strategic_incapacitation|status)'
owners = ["crates/adventuresim-core/src/morale.rs"]

